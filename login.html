<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Logística</title>

    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                LOGÍSTICA
            </div>

            <h1>
                Bem-vindo!
            </h1>

            <p class="descricao">
                Entre para acessar o conteúdo sobre logística.
            </p>


            <form id="loginForm">

                <div class="campo">

                    <label for="usuario">
                        Usuário
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        placeholder="Digite seu usuário"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <button type="submit">
                    ENTRAR
                </button>


                <p id="mensagem"></p>

            </form>

            <div class="cadastro">

            <p>Não possui uma conta?</p>

            <a href="cadastro.html">
               CRIAR CADASTRO
              </a>

            </div>


            <div class="informacao">

                <p>
                    Acesso demonstrativo
                </p>

                <span>
                    Usuário: admin
                </span>

                <span>
                    Senha: 1234
                </span>

            </div>

        </div>

    </div>


    <script src="js/login.js"></script>

</body>

</html>
