<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Logística</title>

    <link rel="stylesheet" href="css/cadastro.css">
</head>

<body>

    <div class="cadastro-container">

        <div class="cadastro-card">

            <div class="logo">
                LOGÍSTICA
            </div>

            <h1>
                Criar conta
            </h1>

            <p class="descricao">
                Cadastre-se para acessar o projeto.
            </p>


            <form id="cadastroForm">

                <div class="campo">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="usuario">
                        Usuário
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        placeholder="Escolha um usuário"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Crie uma senha"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        placeholder="Digite a senha novamente"
                        required
                    >

                </div>


                <button type="submit">
                    CADASTRAR
                </button>


                <p id="mensagem"></p>

            </form>


            <div class="login-link">

                <span>
                    Já possui uma conta?
                </span>

                <a href="login.html">
                    Entrar
                </a>

            </div>

        </div>

    </div>


    <script src="js/cadastro.js"></script>

</body>

</html>
